<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>LIFE</title>

<style>
:root{
  color-scheme:dark;
  --bg:#090b0f;--panel:#10141b;--card:#151a22;--card2:#1a202a;
  --ink:#f5f7fa;--muted:#8f99a8;--line:#2a313d;
  --accent:#78a9ff;--accent2:#a7c7ff;
  --money:#65c18c;--work:#7fa7e8;--commit:#d79283;--life:#aa8fd4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{max-width:1100px;margin:auto;padding:28px 18px 90px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px}
h1{font-size:42px;letter-spacing:.16em;margin:0;font-weight:750}
h2{letter-spacing:-.02em}
.muted,small{color:var(--muted)}
.status,.card,.metric{background:linear-gradient(145deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:20px}
.status{padding:20px;margin:24px 0;box-shadow:0 16px 42px #0004}
.status h2{font-size:28px}
.tabs,.layers{display:flex;gap:8px;overflow:auto;padding:2px}
.tabs button,.layers button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 16px;min-height:44px;white-space:nowrap;transition:background .25s ease,border-color .25s ease,transform .25s ease}
.tabs .on,.layers .on{background:#202938;border-color:#43526a;color:#fff}
.view{display:none;margin-top:22px}.view.on{display:block;animation:layerIn .42s cubic-bezier(.2,.7,.2,1) both}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{padding:16px}.metric b{font-size:24px}.metric small{letter-spacing:.08em}
.card{padding:16px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 8px 24px #0002}
.amt{font-size:21px;font-weight:750;text-align:right}
.mini{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 10px;margin:5px 0 0 5px;min-height:38px}
.paid{opacity:.48}.paid .name{text-decoration:line-through}
.week{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.day{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:14px;border-bottom:1px solid var(--line);min-height:75px}
.day:last-child{border-bottom:0}
.event{padding:10px;border-left:5px solid #777;background:var(--card);border-radius:11px;margin:5px;animation:layerIn .42s cubic-bezier(.2,.7,.2,1) both}
.event.money{border-color:var(--money)}.event.work{border-color:var(--work)}.event.commitments{border-color:var(--commit)}.event.life{border-color:var(--life)}
.add{position:sticky;bottom:15px;text-align:right;margin-top:20px}
.add button{border:1px solid #334158;background:#e8eef8;color:#101318;border-radius:999px;padding:13px 19px;font-weight:750;box-shadow:0 10px 30px #0006}
dialog{border:1px solid var(--line);border-radius:22px;width:min(520px,calc(100% - 24px));background:var(--panel);color:var(--ink);box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0c1016;min-height:44px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink)}.check input{width:auto}
.actions{text-align:right;margin-top:18px}.actions button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);margin-left:6px;background:var(--card2)}
.actions .save{background:#e8eef8;color:#101318;border-color:#e8eef8}
.parking{padding:20px;border:1px dashed #3a4351;border-radius:18px;color:var(--muted);background:#0d1015}
@keyframes layerIn{from{opacity:0;transform:translateY(-4px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.view.on,.event{animation:none}.tabs button,.layers button{transition:none}}
@media(max-width:600px){.summary{grid-template-columns:1fr}.card{align-items:flex-start}h1{font-size:36px}}
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#090b0f">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
.brand{display:flex;align-items:center;gap:14px}
.life-logo{width:62px;height:62px;object-fit:contain;opacity:.5;filter:drop-shadow(0 0 14px rgba(255,255,255,.18))}
header .muted:last-child{opacity:.5;letter-spacing:.08em}
@media(max-width:600px){.life-logo{width:52px;height:52px}}
</style>

<style>
/* LIFE V6 — Launchpad */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:99999;
  pointer-events:none;
  background:#000;
  animation:lifeLaunchVeil 1.35s cubic-bezier(.22,.72,.25,1) forwards;
}
.app{
  animation:lifeLaunchApp 1.15s cubic-bezier(.22,.72,.25,1) both;
}
.life-logo{
  animation:lifeMoonWake 1.65s cubic-bezier(.22,.72,.25,1) both;
}
@keyframes lifeLaunchVeil{
  0%,16%{opacity:1}
  58%{opacity:.56}
  100%{opacity:0;visibility:hidden}
}
@keyframes lifeLaunchApp{
  0%,12%{opacity:0;transform:scale(.992);filter:blur(5px)}
  62%{opacity:.72;transform:scale(.998);filter:blur(1.5px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
@keyframes lifeMoonWake{
  0%,18%{opacity:0;transform:scale(.96);filter:blur(5px) brightness(.75)}
  64%{opacity:.58;transform:scale(1.015);filter:blur(.6px) brightness(1.12)}
  100%{opacity:.5;transform:scale(1);filter:blur(0) brightness(1)}
}
@media(prefers-reduced-motion:reduce){
  body::before{animation:none;display:none}
  .app,.life-logo{animation:none}
}
</style>


<style>
/* LIFE V8 — Dashboard */
.app{max-width:1380px;padding:26px 24px 80px}
header{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:18px}
.brand{gap:16px}.life-logo{width:72px;height:72px;opacity:.72;filter:drop-shadow(0 0 18px rgba(255,255,255,.13))}
.status{margin:18px 0;padding:26px 28px;min-height:150px;display:flex;flex-direction:column;justify-content:center;
background:
radial-gradient(circle at 72% 38%,rgba(230,238,255,.08),transparent 18%),
linear-gradient(135deg,#141a23,#0d1219);position:relative;overflow:hidden}
.status:after{content:"";position:absolute;right:7%;top:50%;width:88px;height:88px;transform:translateY(-50%);
background:url("./life-logo.png") center/contain no-repeat;opacity:.22}
.tabs{margin:0 0 18px}.tabs button{padding:11px 21px}
#now.view.on{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.7fr);gap:16px;align-items:start}
#now>h2{grid-column:1/-1;margin:8px 0 0}
#nowList{grid-column:1}

#week.view.on,#money.view.on,#parking.view.on{animation:layerIn .42s cubic-bezier(.2,.7,.2,1) both}
.card{min-height:92px;padding:18px 20px}
.add{position:fixed;right:28px;bottom:26px;z-index:30}
.add button{padding:14px 22px}
@media(min-width:900px){
  #money.view.on{display:grid;grid-template-columns:1fr 2fr;gap:16px;align-items:start}
  #money>h2{grid-column:1/-1}.summary{grid-template-columns:1fr}.metric{min-height:92px}
  #moneyList{grid-column:2;grid-row:2}
  #week.view.on{display:block}
}
@media(max-width:760px){
  #now.view.on{display:block}
  .status:after{opacity:.12}.life-logo{width:58px;height:58px}
}
</style>


<style>
/* LIFE V9 — Functional Dashboard */
#now.view.on{grid-template-columns:minmax(0,1.55fr) minmax(300px,.72fr)}
.dash-side{grid-column:2;grid-row:2;display:grid;gap:12px}
.side-card{background:linear-gradient(145deg,var(--card),var(--panel));border:1px solid var(--line);border-radius:20px;padding:20px}
.side-kicker{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:13px}
.upcoming-list{display:grid;gap:7px}
.up-row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.up-row:last-child{border-bottom:0}.up-date{font-size:12px;color:var(--muted)}.up-name{font-weight:650}.up-amt{font-weight:750}
.up-empty{color:var(--muted);line-height:1.5;padding:8px 0}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick-grid button{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px;text-align:left}
.quick-grid button:active{transform:scale(.98)}
@media(max-width:760px){#now.view.on{display:block}.dash-side{display:grid;margin-top:14px}.quick-grid{grid-template-columns:1fr 1fr}}
</style>

</head><body><div class="app">
<header><div><div class="brand"><img src="./life-logo.png" class="life-logo" alt=""><div><h1>LIFE</h1></div></div><div class="muted" id="today"></div></div><div class="muted">V9</div></header>
<div class="status"><small>ORIENTATION</small><h2 style="margin:3px 0">You’re okay.</h2><div id="next">Nothing urgent is waiting.</div></div>
<nav class="tabs"><button class="on" data-v="now">NOW</button><button data-v="week">WEEK</button><button data-v="money">MONEY</button><button data-v="parking">PARKING LOT</button></nav>
<section class="view on" id="now"><h2>What needs attention?</h2><div id="nowList"></div>
<aside class="dash-side">
  <section class="side-card">
    <div class="side-kicker">UPCOMING · 7 DAYS</div>
    <div id="upcoming7" class="upcoming-list"></div>
  </section>
  <section class="side-card">
    <div class="side-kicker">QUICK ADD</div>
    <div class="quick-grid">
      <button type="button" data-quick="task">＋ Task</button>
      <button type="button" data-quick="event">＋ Event</button>
      <button type="button" data-quick="money">＋ Money</button>
      <button type="button" data-quick="idea">＋ Idea</button>
    </div>
  </section>
</aside></section>
<section class="view" id="week"><div class="layers"><button class="on" data-l="money">💵 Money</button><button class="on" data-l="work">💼 Work</button><button class="on" data-l="commitments">📅 Commitments</button><button class="on" data-l="life">✦ Life</button></div><div class="week" id="weekGrid" style="margin-top:12px"></div></section>
<section class="view" id="money"><h2>Money</h2><div class="summary"><div class="metric"><small>ACTIVE</small><br><b id="active">$0</b></div><div class="metric"><small>NEXT 7 DAYS</small><br><b id="seven">$0</b></div><div class="metric"><small>PAID / CLEARED</small><br><b id="paid">0</b></div></div><div id="moneyList"></div></section>
<section class="view" id="parking"><h2>Parking Lot</h2><div class="parking">Collections and intentionally deferred items live here. Documented, but excluded from NOW.</div></section>
<div class="add"><button id="add">＋ Add to LIFE</button></div>
</div>
<dialog id="dlg"><form id="form"><h2 id="formTitle">Add to LIFE</h2><label>What is it?</label><input id="title" required><label>Date</label><input id="date" type="date" required><label>Layer</label><select id="layer"><option value="money">Money</option><option value="work">Work</option><option value="commitments">Commitments</option><option value="life">Life</option></select><label>Amount (optional)</label><input id="amount" type="number" min="0" step=".01"><label>Priority</label><select id="priority"><option value="protect">Protect</option><option value="normal" selected>Normal</option><option value="later">Later</option></select><label class="check"><input id="recurring" type="checkbox"> Repeat monthly</label><input id="editId" type="hidden"><div class="actions"><button type="button" id="cancel">Cancel</button><button class="save">Save</button></div></form></dialog>
<script>
(()=>{const KEY='life-data';let items=[];try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(items)),cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('today').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.v).classList.add('on');render()});
document.querySelectorAll('.layers button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');week()});
function card(x){return `<div class="card ${x.status==='paid'?'paid':''}"><div><b class="name">${esc(x.title)}</b><br><small>${fmt(x.date)} · ${x.status==='paid'?'Paid':x.priority==='protect'?'Protect':'Actionable'}${x.recurring?' · Monthly':''}</small></div><div><div class="amt">${x.amount?cash(x.amount):''}</div><button class="mini" data-paid="${x.id}">${x.status==='paid'?'Undo':'Paid'}</button><button class="mini" data-edit="${x.id}">Edit</button><button class="mini" data-del="${x.id}">Delete</button></div></div>`}
function render(){let m=items.filter(x=>x.layer==='money'),open=m.filter(x=>x.status!=='paid').sort((a,b)=>a.date.localeCompare(b.date));$('next').innerHTML=open[0]?`Next: <b>${esc(open[0].title)}</b>${open[0].amount?' · '+cash(open[0].amount):''} · ${fmt(open[0].date)}`:'Nothing urgent is waiting.';$('nowList').innerHTML=open.slice(0,3).map(card).join('')||'<p class="muted">Nothing needs attention.</p>';$('moneyList').innerHTML=m.sort((a,b)=>a.date.localeCompare(b.date)).map(card).join('');$('active').textContent=cash(open.reduce((s,x)=>s+(+x.amount||0),0));let n=new Date();n.setHours(0,0,0,0),e=new Date(n);e.setDate(n.getDate()+7);$('seven').textContent=cash(open.filter(x=>{let d=new Date(x.date+'T12:00:00');return d>=n&&d<=e}).reduce((s,x)=>s+(+x.amount||0),0));$('paid').textContent=m.filter(x=>x.status==='paid').length;bind();week()}
function bind(){document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{let x=items.find(i=>i.id===b.dataset.paid);if(x.status!=='paid'&&x.recurring){let d=new Date(x.date+'T12:00:00');d.setMonth(d.getMonth()+1);items.push({...x,id:'i'+Date.now(),date:d.toISOString().slice(0,10),status:'due'})}x.status=x.status==='paid'?'due':'paid';save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this item?')){items=items.filter(i=>i.id!==b.dataset.del);save();render()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(items.find(i=>i.id===b.dataset.edit)))}
function week(){let sel=[...document.querySelectorAll('.layers .on')].map(b=>b.dataset.l),start=new Date();start.setHours(12,0,0,0),h='';for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let iso=d.toISOString().slice(0,10),a=items.filter(x=>x.date===iso&&sel.includes(x.layer));h+=`<div class="day"><b>${d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}<br><small>${d.getDate()}</small></b><div>${a.map(x=>`<div class="event ${x.layer}"><b>${esc(x.title)}</b>${x.amount?'<br><small>'+cash(x.amount)+'</small>':''}</div>`).join('')||'<small>Open space</small>'}</div></div>`}$('weekGrid').innerHTML=h}
function openForm(x){$('form').reset();$('formTitle').textContent=x?'Edit LIFE item':'Add to LIFE';$('editId').value=x?.id||'';$('title').value=x?.title||'';$('date').value=x?.date||new Date().toISOString().slice(0,10);$('layer').value=x?.layer||'money';$('amount').value=x?.amount||'';$('priority').value=x?.priority||'normal';$('recurring').checked=!!x?.recurring;$('dlg').showModal()}
$('add').onclick=()=>openForm();$('cancel').onclick=()=>$('dlg').close();$('form').onsubmit=e=>{e.preventDefault();let id=$('editId').value,obj={title:$('title').value.trim(),date:$('date').value,layer:$('layer').value,amount:Math.max(0,+$('amount').value||0),priority:$('priority').value,recurring:$('recurring').checked,status:'due'};if(id){let i=items.findIndex(x=>x.id===id);items[i]={...items[i],...obj}}else items.push({id:'i'+Date.now(),...obj});save();$('dlg').close();render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})();
</script>
<script>
(function(){
  function parseDate(v){
    if(!v) return null;
    const d=new Date(v+"T12:00:00");
    return isNaN(d)?null:d;
  }
  function money(v){
    const n=Number(v);
    return Number.isFinite(n)&&n!==0 ? "$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
  }
  function getItems(){
    try{
      const x=JSON.parse(localStorage.getItem("life-data")||"[]");
      if(Array.isArray(x)) return x;
      if(x && Array.isArray(x.items)) return x.items;
    }catch(e){}
    return [];
  }
  function renderUpcoming(){
    const box=document.getElementById("upcoming7"); if(!box) return;
    const now=new Date(); now.setHours(0,0,0,0);
    const end=new Date(now); end.setDate(end.getDate()+7);
    const rows=getItems().map(x=>({x,d:parseDate(x.date||x.due||x.dueDate)}))
      .filter(o=>o.d && o.d>=now && o.d<=end && !(o.x.paid||o.x.status==="paid"))
      .sort((a,b)=>a.d-b.d);
    if(!rows.length){box.innerHTML='<div class="up-empty">Nothing scheduled in the next seven days. Space is allowed.</div>';return;}
    box.innerHTML=rows.slice(0,6).map(({x,d})=>{
      const label=x.name||x.title||x.label||"Untitled";
      const amt=money(x.amount);
      const ds=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      return `<div class="up-row"><div class="up-date">${ds}</div><div class="up-name">${label}</div><div class="up-amt">${amt}</div></div>`;
    }).join("");
  }
  function openExistingAdd(kind){
    const add=document.querySelector(".add button");
    if(add) add.click();
    setTimeout(()=>{
      const dlg=document.querySelector("dialog[open]");
      if(!dlg) return;
      const selects=[...dlg.querySelectorAll("select")];
      const category=selects.find(s=>[...s.options].some(o=>/money|work|commit|life/i.test(o.value+" "+o.text)));
      if(category){
        const wanted=kind==="money"?"money":kind==="event"?"commitments":"life";
        const opt=[...category.options].find(o=>(o.value+" "+o.text).toLowerCase().includes(wanted));
        if(opt){category.value=opt.value;category.dispatchEvent(new Event("change",{bubbles:true}));}
      }
    },30);
  }
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-quick]");
    if(b) openExistingAdd(b.dataset.quick);
    setTimeout(renderUpcoming,80);
  });
  window.addEventListener("storage",renderUpcoming);
  document.addEventListener("DOMContentLoaded",renderUpcoming);
  setTimeout(renderUpcoming,150);
})();
</script>

</body></html>
